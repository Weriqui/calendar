{% extends "base.html" %}
{% block content %}
    <div class="mb-8 grid grid-cols-1 gap-5 sm:grid-cols-3">
    </div>

    <div class="bg-white p-4 rounded-lg shadow mb-8 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">
                        Mostrar calendários específicos
                    </label>
                    <select multiple 
                        x-data="choices({ 
                            removeItemButton: true,
                            placeholder: true,
                            placeholderValue: 'Todos os calendários',
                            choices: calendarChoices
                        })"
                        @input.self="selectedCalendars = $event.detail"
                        class="mt-1">
                    </select>
                </div>
                <div>
                    <label for="search" class="block text-sm font-medium text-gray-700">Filtrar por nome</label>
                    <input type="text" id="search" x-model.debounce.300ms="searchText" placeholder="Digite o nome do calendário..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Filtrar por usuários</label>
                    <select multiple
                        x-data="choices({
                            removeItemButton: true,
                            choices: uniqueUsers
                        })"
                        @input.self="selectedUsers = $event.detail"
                        class="mt-1">
                    </select>
                </div>
                <div class="flex items-center space-x-4 pt-1">
                    <span class="text-sm font-medium text-gray-700">Lógica:</span>
                    <label class="inline-flex items-center"><input type="radio" x-model="userFilterMode" value="contains" class="form-radio"><span class="ml-2">Contém</span></label>
                    <label class="inline-flex items-center"><input type="radio" x-model="userFilterMode" value="not-contains" class="form-radio"><span class="ml-2">Não Contém</span></label>
                </div>
            </div>
        </div>
    </div>

    <div x-ref="cardsContainer" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <template x-for="calendar in filteredCalendars" :key="calendar.id">
            <div class="bg-white rounded-lg shadow-md p-4 flex flex-col space-y-3 transition-transform duration-200 hover:scale-105">
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-slate-800 flex-1 break-words" x-text="calendar.summary"></h3>
                    <span x-show="calendar.users.some(u => u.role === 'owner')" title="Este calendário possui um Dono" class="text-amber-500 ml-2">👑</span>
                </div>
                
                <div class="flex-grow">
                    <p class="text-sm font-medium text-slate-600" x-text="`${calendar.users.length} usuário(s) com acesso`"></p>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <template x-for="user in calendar.users.slice(0, 5)" :key="user.email">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800"
                                :title="user.email"
                                x-text="user.email.split('@')[0]">
                            </span>
                        </template>
                        <template x-if="calendar.users.length > 5">
                            <span class="inline-flex items-center justify-center h-6 w-6 rounded-full text-xs font-medium bg-slate-200 text-slate-700"
                                :title="`${calendar.users.length - 5} outros usuários`"
                                x-text="`+${calendar.users.length - 5}`">
                            </span>
                        </template>
                    </div>
                </div>
                
                <button @click="openEditModal(calendar)" class="self-end text-sm font-semibold text-sky-600 hover:text-sky-800 transition-colors">
                    Gerenciar
                </button>
            </div>
        </template>
        
        <template x-if="!filteredCalendars.length">
            <div class="col-span-full bg-white rounded-lg shadow p-8 text-center text-slate-500">
                <h3 class="text-lg font-semibold">Nenhum calendário encontrado</h3>
                <p class="mt-1">Tente ajustar seus filtros de busca.</p>
            </div>
        </template>
  </div>
{% endblock %}
