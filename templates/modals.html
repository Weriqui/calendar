<!-- Modal para Edição Individual (sem alterações) -->
<div x-show="openModalId === 'modal-edit'" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
    <div @click.outside="openModalId = null" class="bg-white rounded-2xl w-full max-w-2xl flex flex-col max-h-[90vh]">
        <template x-if="editing.calendar">
            <div class="p-6 border-b">
                <h3 class="text-xl font-semibold" x-text="'Gerenciar: ' + editing.calendar.summary"></h3>
            </div>
        </template>
        
        <form x-ref="editForm" @submit.prevent="submitEditForm" class="flex-1 overflow-y-auto p-6 space-y-6">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Nome do Calendário</span>
                <input type="text" x-model="editing.newName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </label>
            <div class="space-y-2">
                <p class="text-sm font-medium text-slate-700">Usuários com acesso</p>
                <div class="border rounded-lg max-h-60 overflow-y-auto p-2 space-y-2">
                    <template x-for="user in editing.users" :key="user.email">
                        <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-lg">
                            <span class="flex-1 text-sm truncate" :title="user.email" x-text="user.email"></span>
                            <select x-model="user.role" class="text-sm rounded-md border-gray-300 shadow-sm">
                                <option value="reader">Pode ver</option>
                                <option value="writer">Pode editar</option>
                                <option value="owner">É dono</option>
                            </select>
                            <button type="button" @click="removeUserFromEditList(user.email)" class="text-red-500 hover:text-red-700 font-bold text-xl px-2 transition-colors">×</button>
                        </div>
                    </template>
                    <p x-show="!editing.users.length" class="text-sm text-slate-400 italic p-4 text-center">Nenhum usuário com acesso.</p>
                </div>
            </div>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Adicionar novos usuários</span>
                <p class="text-xs text-slate-500">Digite ou cole e-mails, separados por vírgula ou Enter.</p>
                 <select multiple 
                    x-data="choices({ addItems: true, removeItemButton: true, delimiter: ',' })"
                    @input.self="editing.usersToAdd = $event.detail"
                    class="mt-1">
                </select>
            </label>
        </form>
        
        <div class="p-6 bg-slate-50 rounded-b-2xl flex justify-end gap-3 border-t">
            <button type="button" @click="openModalId = null" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors">Cancelar</button>
            <button @click="$refs.editForm.requestSubmit()" type="button" class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">Salvar Alterações</button>
        </div>
    </div>
</div>

<!-- Modal de Ações em Massa (TOTALMENTE CORRIGIDO E FINAL) -->
<div x-show="openModalId === 'modal-bulk'" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
  <div @click.outside="openModalId = null" class="bg-white rounded-2xl w-full max-w-2xl p-6 space-y-4">
    <h3 class="text-xl font-semibold">Operações em massa</h3>
    <form @submit.prevent="submitBulkForm" class="space-y-4">
        
        <!-- 1. SELECIONE OS CALENDÁRIOS -->
        <label class="block">
            <span class="text-sm font-medium">1. Selecione os Calendários</span>
            <select multiple
                id="bulk-calendars-select"
                x-data="choices({ choices: calendarChoices, removeItemButton: true, placeholder: true, placeholderValue: 'Selecione um ou mais calendários...' })" 
                @input.self="bulk.calendars = $event.detail">
            </select>
        </label>
        
        <!-- 2. ESCOLHA A OPERAÇÃO -->
        <!-- Envolvido em um template para ser recriado quando os calendários mudarem -->
        <template x-if="bulk.calendars.length > 0" :key="bulk.calendars.join(',')">
            <label class="block" x-transition>
                <span class="text-sm font-medium">2. Escolha a Operação</span>
                <select x-data="choices({ shouldSort: false, itemSelectText: 'Selecionar' })" @input.self="bulk.action = $event.detail || ''">
                    <option value="">Selecione...</option>
                    <option value="adicionar">Adicionar usuários</option>
                    <option value="remover">Remover usuários</option>
                    <option value="editar">Editar permissão de usuários</option>
                </select>
            </label>
        </template>

        <!-- 3. SELECIONE OS USUÁRIOS -->
        <template x-if="bulk.action && bulk.calendars.length > 0 && !bulk.isLoadingUsers" :key="bulk.action">
            <div x-transition>
                <label class="block">
                    <span class="text-sm font-medium" x-text="bulk.action === 'adicionar' ? '3. Informe os Novos Usuários' : '3. Selecione os Usuários'"></span>
                    <select multiple 
                        x-data="choices({
                            addItems: bulk.action === 'adicionar',
                            removeItemButton: true,
                            delimiter: ',',
                            choices: bulk.userChoices,
                            placeholder: true,
                            placeholderValue: (bulk.action === 'adicionar' ? 'Digite ou cole os e-mails...' : 'Selecione na lista...')
                        })"
                        @input.self="bulk.users = $event.detail">
                    </select>
                </label>
            </div>
        </template>
        
        <template x-if="bulk.isLoadingUsers">
            <div class="border rounded-md p-3 text-center text-slate-500 bg-slate-50">
                Carregando usuários...
            </div>
        </template>

        <!-- 4. DEFINA A NOVA PERMISSÃO -->
        <template x-if="bulk.action === 'editar' && bulk.users.length > 0">
            <div x-transition>
                <label class="block">
                    <span class="text-sm font-medium">4. Defina a Nova Permissão</span>
                    <select x-data="choices({ shouldSort: false, itemSelectText: 'Selecionar' })" @input.self="bulk.role = $event.detail || 'writer'">
                        <option value="writer">Pode editar eventos</option>
                        <option value="reader">Pode ver detalhes</option>
                        <option value="owner">É dono (gerencia compartilhamento)</option>
                    </select>
                </label>
            </div>
        </template>
        
        <div class="flex justify-end gap-2 pt-4 border-t">
            <button type="button" @click="openModalId = null" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300">Cancelar</button>
            <button type="submit" 
                :disabled="!bulk.action || !bulk.calendars.length || !bulk.users.length || bulk.isLoadingUsers" 
                class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:bg-indigo-300 disabled:cursor-not-allowed transition-colors">
                Executar
            </button>
        </div>
    </form>
  </div>
</div>
